name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  tag:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    env:
      ADDON: LayerSwapStealth
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version from the .toc
        id: ver
        run: |
          VERSION="$(grep -m1 '^## Version:' "$ADDON.toc" | sed 's/^## Version:[[:space:]]*//' | tr -d '\r' | xargs)"
          if [[ -z "$VERSION" ]]; then
            echo "::error::No '## Version:' line found in $ADDON.toc"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already tagged - bump '## Version:' in the .toc to make a new release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Releasing v$VERSION"
          fi

      - name: Tag the version and start the packaging run
        if: steps.ver.outputs.exists == 'false'
        run: |
          git tag "v${{ steps.ver.outputs.version }}"
          git push origin "v${{ steps.ver.outputs.version }}"
          gh workflow run release.yml --ref "v${{ steps.ver.outputs.version }}"

  package:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the packager builds the changelog from history

      - name: Package and upload (GitHub Release + CurseForge)
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
