name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ADDON: LayerSwapStealth
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the .toc
        id: ver
        run: |
          VERSION="$(grep -m1 '^## Version:' "$ADDON.toc" | sed 's/^## Version:[[:space:]]*//' | tr -d '\r' | xargs)"
          if [[ -z "$VERSION" ]]; then
            echo "::error::No '## Version:' line found in $ADDON.toc"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already released - bump '## Version:' in the .toc to make a new one."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Releasing v$VERSION"
          fi

      - name: Package the add-on
        if: steps.ver.outputs.exists == 'false'
        run: |
          mkdir -p "build/$ADDON"
          cp "$ADDON.toc" "$ADDON.lua" "build/$ADDON/"
          cp -r Media "build/$ADDON/"
          cd build
          zip -r "../$ADDON-${{ steps.ver.outputs.version }}.zip" "$ADDON"
          cd ..
          unzip -l "$ADDON-${{ steps.ver.outputs.version }}.zip"

      - name: Publish GitHub Release
        if: steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: LayerSwap Stealth v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: ${{ env.ADDON }}-${{ steps.ver.outputs.version }}.zip
          generate_release_notes: true
